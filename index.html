<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ed's Profile — Developer & Gamer</title>
  <meta name="description"
    content="Personal profile of a developer passionate about music, JRPGs, animals and anime culture. Le Wagon student.">

  <meta name="theme-color" content="#14213d">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400..900&family=Roboto:ital,wght@0,300;0,400;0,700;1,300&family=Trykker&display=swap"
    rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <!-- Tarjeta principal: presentación -->
    <section class="card" aria-labelledby="profile-title">
      <h1 id="profile-title" class="profile-title">
        Hello, I'm <strong>ED</strong> <span aria-hidden="true">✌️</span>
      </h1>

      <img id="profile-pic" src="images/profile.jpeg"
        alt="Portrait of Me, the site owner" width="200" height="200" loading="lazy" decoding="async">

      <p class="profile-bio">
        I love music <span class="emoji" aria-hidden="true">💿</span>,
        JRPG video games <span class="emoji" aria-hidden="true">🎮</span>,
        animals <span class="emoji" aria-hidden="true">🕷️</span>
        and anime culture <span class="emoji" aria-hidden="true">🤖</span>.
        <br>
        I enrolled in <em>Le Wagon</em> to enhance my coding abilities and gain the capacity to build impressive web
        applications.
      </p>

      <a href="https://steamcommunity.com" class="btn btn--primary" target="_blank" rel="noopener noreferrer">
        Discover Steam
      </a>
    </section>

    <!-- Tarjeta secundaria: redes -->
    <section class="card" aria-labelledby="rrss-card-title">
      <h2 id="rrss-card-title" class="card-title trykker-regular">Follow me</h2>

      <ul class="list-rrss-inline">
        <li>
          <a href="https://github.com/oginokio" target="_blank" rel="noopener noreferrer" aria-label="Visit my GitHub profile">
            <i class="fa-brands fa-github-square rrss-icon" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://steamcommunity.com" target="_blank" rel="noopener noreferrer"
            aria-label="Visit my Steam profile">
            <i class="fa-brands fa-steam rrss-icon" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://www.last.fm" target="_blank" rel="noopener noreferrer" aria-label="Visit my Last.fm profile">
            <i class="fa-brands fa-lastfm rrss-icon" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </section>

  </main>
</body>

</html>
